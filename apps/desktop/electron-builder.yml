appId: com.mccreator.app
productName: MC Creator
directories:
  output: release
  buildResources: build-resources
files:
  - from: out
    filter:
      - '**/*'
      - '!**/node_modules/**'
      - '!**/.vite/**'
asar: true
compression: maximum
win:
  target:
    - target: zip
      arch:
        - x64
  icon: build-resources/icon.ico
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: dir
      arch:
        - x64
  icon: build-resources/icon.png
  category: Development
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: dir
      arch:
        - x64
        - arm64
  icon: build-resources/icon.icns
  category: public.app-category.developer-tools
extraResources:
  - from: ../../packages/core/src/generators/mod
    to: generators/mod
    filter:
      - '**/*.js'
      - '**/*.d.ts'
      - '**/*.json'
  - from: ../../packages/shared/src
    to: shared
    filter:
      - '**/*.js'
      - '**/*.d.ts'
      - '**/*.json'
extraFiles:
  - from: ./scripts/generate-icon.mjs
    to: scripts/generate-icon.mjs
publish: null
