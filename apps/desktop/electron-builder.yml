appId: com.mccreator.app
productName: MC Creator
directories:
  output: release
  buildResources: build-resources
files:
  # 白名单：只收 electron-vite 的编译产物 out/，外加 Electron 启动必需的 package.json。
  #
  # 为什么用对象形式 from/to 而不是直接写 'out/**/*'：
  #   1. 排除规则的作用域。对象形式的 filter 只作用于 from 子树，
  #      顶层的 '!**/node_modules/**' 会被 electron-builder 同时灌进
  #      node_modules 收集器（app-builder-lib getNodeModuleFileMatcher），
  #      那会把生产依赖全部排除掉，包里连 zod/jszip 都不会有。
  #   2. 必须显式写 to: out。`- from: out`（to 默认是包根）会把 out/ 前缀剥掉，
  #      导致 out/main/index.js 进包后变成 main/index.js，而 package.json 的
  #      "main": "./out/main/index.js" 指向不存在的路径 —— 实测直接报
  #      Application entry file "out\main\index.js" ... was not found in this archive。
  #   3. package.json 必须单列。对象形式的 from 是 out（!= appDir），
  #      electron-builder 不会自动补 package.json，不写则包里没有清单文件。
  - 'package.json'
  - from: out
    to: out
    filter:
      - '**/*'
      - '!**/node_modules/**'
      - '!**/.vite/**'
  # @mc-creator/jobobject（§8.3 原生绑定）的收集清单。
  #
  # 排除规则必须关在这个对象的 filter 里：顶层 '!' 开头的字符串会被
  # getNodeModuleFileMatcher 一并收走（那会排除掉全部生产依赖，见上）。
  #
  # ⚠️ 已知局限（实测，别误以为这段白名单已生效）：
  # 对 **workspace 软链包**，electron-builder 既不应用该包自己的 files[]，
  # 也不应用这里的 from/to/filter —— 它直接把整个包目录拷进去。
  # 变异实验：删掉本段只留 asarUnpack，产物 26 个文件；加上本段 24 个文件。
  # 也就是说白名单只被部分尊重，node-gyp 的中间产物（obj/tlog/ipdb/lib/exp，
  # 约 1.4MB）仍会进包。真正生效的是 asarUnpack 那条（.node 确实被解包）。
  #
  # 要彻底瘦身需让 build/ 不存在于包目录内（例如把产物复制到
  # prebuilds/<platform>-<arch>/ 后删除 build/），代价是失去增量编译缓存。
  # 当前判断：1.4MB 构建垃圾换增量编译缓存，可接受，暂不改。
  - from: node_modules/@mc-creator/jobobject
    to: node_modules/@mc-creator/jobobject
    filter:
      - 'index.js'
      - 'index.d.ts'
      - 'launcher.js'
      - 'package.json'
      - 'build/Release/jobobject.node'
      - '!build/Release/*.lib'
      - '!build/Release/*.exp'
      - '!build/Release/*.ipdb'
      - '!build/Release/*.iobj'
      - '!build/Release/*.pdb'
      - '!build/*.sln'
      - '!build/*.vcxproj*'
      - '!build/config.gypi'
      - '!binding.gyp'
      - '!src/**'
      - '!dist/**'
      - '!scripts/**'
      - '!README.md'
      - '!tsconfig.json'
asar: true
# 原生模块解包（设计文档 §15 硬性要求）
# asar 只是归档格式，dlopen 无法从归档内加载 .node，必须解包到 app.asar.unpacked/
# 精确列出实际用到的原生模块，不用宽泛的 '**/*.node'（那会把无关二进制也拖出包体）
#
# 为什么不能只依赖 electron-builder 的 smartUnpack（默认开启，实测确实会兜底）：
#   smartUnpack 靠「模块里出现 .node/.dll/.exe/.dylib/.so 或无扩展名二进制」来猜。
#   它能猜对 node-pty，但属于隐式行为：一旦有人关掉 smartUnpack 就会静默失效。
#   而且它会误伤——实测 jszip 因为一个无扩展名的 .jekyll-metadata 被判为二进制，
#   整包 jszip（约 60 个文件）被无谓解包。显式列出既精确又不依赖猜测。
asarUnpack:
  # node-pty：集成终端面板（src/main/ipc/terminal.ts require('node-pty')）。
  #   需整包解包：不止 pty.node，还有 conpty.dll / winpty.dll / OpenConsole.exe /
  #   winpty-agent.exe —— 这些是 .node 在运行时按同级相对路径加载的伴生二进制，
  #   只解 .node 会导致加载 .node 成功但创建 PTY 失败。
  #   降级行为：require 失败时 catch 住，终端 IPC 返回结构化错误，其余功能不受影响。
  - '**/node_modules/node-pty/**'
  # @mc-creator/jobobject：§8.3 进程级隔离的原生绑定。
  #   需整包解包：build/Release/jobobject.node 必须能被 dlopen，而 asar 内的
  #   归档 dlopen 不了。与 node-pty 同样按「整包」而非单文件解包 ——
  #   launcher.js 与 index.js 要在运行时按相对路径 require 同一个包。
  #   降级行为：二进制缺失/未编译时 index.js 的 available=false，
  #   devkit/sandbox-exec.ts 据此降级并把 enforced.source 标成 'unisolated'
  #   （不会崩，也不会假装已隔离）。
  #
  #   为什么必须显式列出（不能靠 smartUnpack 猜）：
  #   这个包是 **workspace 软链**，electron-builder 的 smartUnpack 靠
  #   「包目录里出现 .node/.dll/.exe」来猜，而软链解析时机与普通目录不同。
  #   实测：加这条之前打包成功，但 app.asar.unpacked 里**根本没有**
  #   @mc-creator/jobobject —— 整个包连同 .node 都被塞进了 asar。
  #   那种包在开发时完全正常（node_modules 里有真实文件），只有打包产物会
  #   dlopen 失败 —— 与 MEMORY §2-①「打包启动即崩」是同一类陷阱：
  #   pnpm build / test 全绿都证明不了它。已做变异验证：删掉本条，
  #   electron-builder.test.ts 的「asarUnpack 覆盖每个原生模块」立刻变红。
  # asarUnpack 只接受 glob 字符串数组（app-builder-lib 的 PlatformSpecificBuildOptions
  # 里类型是 Array<string>），**不能**用 files 那套 from/to/filter 对象形式 ——
  # 写成对象会被 schema 校验直接拒掉：
  #   Invalid configuration object ... does not match the API schema
  # 所以排除构建垃圾只能靠下面 files 段的 from/to/filter（那里可以用对象形式）。
  - '**/node_modules/@mc-creator/jobobject/**'
# isolated-vm 已从依赖中移除（原先 asarUnpack 里的 isolated-vm 一并删除）。
#   它曾被用来「沙箱化」Mustache 渲染，但沙箱里跑的是**我们自己写的约 100 行
#   渲染器**，template/fields 只作为 ExternalCopy 数据注入、从不当代码执行。
#   于是它唯一的作用是「同一套渲染逻辑写两遍」，任何安全修复都要做两遍，
#   漏一处就是漏洞 —— 实测两条路径确实同构地带着全部 4 个缺陷。
#   而且它在 Electron 44 上**从来没生效过一次**，有两条独立的硬证据：
#     1) ABI：预编译只有 abi137/abi147，Electron 44 是 abi149，require 必抛
#        "No native build was found for platform=win32 arch=x64 runtime=electron abi=149"；
#        源码也编不过（V8 头文件不兼容，C2660 ×2 => MSBuild exit 1）。
#     2) 与 ABI 无关：那段沙箱脚本字符串本身是 TypeScript（`x as Record<...>`、
#        `let condVal: unknown;`），即便原生模块能加载，compileScript 也必然抛
#        SyntaxError（实测 "Unexpected identifier 'as'"）然后静默回退。
#   威胁本身不需要 V8 级隔离：真正的风险是「恶意输入打爆主进程」，靠输入校验
#   就够。现为纯 TS 实现 + 完整预算/深度/迭代/原型链防护
#   （见 src/main/ipc/sandboxed-mustache.ts）。
#
# ABI 重建取舍
#   npmRebuild: false —— 显式关闭（electron-builder 默认 true）。
#     当前唯一的原生模块 node-pty 是 N-API 模块（binding.gyp 依赖 node-addon-api，
#     预编译文件名不带 abi 标签），N-API 跨 Node/Electron ABI 稳定，其
#     prebuilds/win32-x64/pty.node 可直接用，rebuild 对它是纯负担 ——
#     在无 MSVC 工具链的机器与 CI 上开着会让打包直接失败。
#   buildDependenciesFromSource: 保持不配置（默认 false）。同上。
npmRebuild: false
compression: maximum
win:
  target:
    - target: zip
      arch:
        - x64
  icon: build-resources/icon.ico
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: dir
      arch:
        - x64
  icon: build-resources/icon.png
  category: Development
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: dir
      arch:
        - x64
        - arm64
  icon: build-resources/icon.icns
  category: public.app-category.developer-tools
  # §21 #6：macOS 公证配置（Apple Developer 要求所有分发应用必须公证）
  # 官方要求（2026-10 核实）：所有分发到 Mac 的应用必须公证，否则 Gatekeeper 会拦截
  # 1. 启用 Hardened Runtime（electron-builder 默认开启，无需显式配置）
  # 2. 启用公证：需要 Apple ID、App-specific Password、Team ID
  # 4. electron-builder 通过 notarize 配置自动处理公证流程
  #    环境变量（CI 注入，本地开发机需自行配置）：
  #    - CSC_LINK: Developer ID Application 证书路径（.p12）
  #    - CSC_KEY_PASSWORD: 证书密码
  #    - APPLE_ID: Apple ID 邮箱
  #    - APPLE_APP_SPECIFIC_PASSWORD: App-specific 密码（非 Apple ID 密码）
  #    - APPLE_TEAM_ID: Developer Team ID（10 位字母数字）
  notarize:
    tool: notarizecli # electron-builder 26+ 推荐，比旧 notarize 工具更稳定
    # 实际值由环境变量注入，配置里只写键名占位，防止提交敏感信息
    appleId: ${{APPLE_ID}}
    appleIdPassword: ${{APPLE_APP_SPECIFIC_PASSWORD}}
    teamId: ${{APPLE_TEAM_ID}}
  # §21 #6：Hardened Runtime 权限配置（启用后必须显式声明用到的例外）
  # electron-builder 默认开启 Hardened Runtime，但部分功能需显式声明例外
  # ⚠️ 以下例外基于现有功能实测，不可随意增减
  hardenedRuntime:
    # §15：node-pty 需要创建子进程管理 PTY
    allowExecutionOfJitCompiledCode: true
    # node-pty / jobobject 的原生模块加载
    disableLibraryValidation: true
    # §8.3：jobobject 进程隔离需要进程间通信
    allowDyldEnvironmentVariables: true
extraResources:
  - from: ../../packages/generator-mod/src
    to: generators/mod
    filter:
      - '**/*.js'
      - '**/*.d.ts'
      - '**/*.json'
  - from: ../../packages/shared/src
    to: shared
    filter:
      - '**/*.js'
      - '**/*.d.ts'
      - '**/*.json'
extraFiles:
  - from: ./scripts/generate-icon.mjs
    to: scripts/generate-icon.mjs
publish: null
