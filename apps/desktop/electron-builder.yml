appId: com.mccreator.app
productName: MC Creator
directories:
  output: release
  buildResources: build-resources
files:
  # 白名单：只收 electron-vite 的编译产物 out/，外加 Electron 启动必需的 package.json。
  #
  # 为什么用对象形式 from/to 而不是直接写 'out/**/*'：
  #   1. 排除规则的作用域。对象形式的 filter 只作用于 from 子树，
  #      顶层的 '!**/node_modules/**' 会被 electron-builder 同时灌进
  #      node_modules 收集器（app-builder-lib getNodeModuleFileMatcher），
  #      那会把生产依赖全部排除掉，包里连 zod/jszip 都不会有。
  #   2. 必须显式写 to: out。`- from: out`（to 默认是包根）会把 out/ 前缀剥掉，
  #      导致 out/main/index.js 进包后变成 main/index.js，而 package.json 的
  #      "main": "./out/main/index.js" 指向不存在的路径 —— 实测直接报
  #      Application entry file "out\main\index.js" ... was not found in this archive。
  #   3. package.json 必须单列。对象形式的 from 是 out（!= appDir），
  #      electron-builder 不会自动补 package.json，不写则包里没有清单文件。
  - 'package.json'
  - from: out
    to: out
    filter:
      - '**/*'
      - '!**/node_modules/**'
      - '!**/.vite/**'
asar: true
# 原生模块解包（设计文档 §15 硬性要求）
# asar 只是归档格式，dlopen 无法从归档内加载 .node，必须解包到 app.asar.unpacked/
# 精确列出实际用到的原生模块，不用宽泛的 '**/*.node'（那会把无关二进制也拖出包体）
#
# 为什么不能只依赖 electron-builder 的 smartUnpack（默认开启，实测确实会兜底）：
#   smartUnpack 靠「模块里出现 .node/.dll/.exe/.dylib/.so 或无扩展名二进制」来猜。
#   它能猜对 node-pty，但属于隐式行为：一旦有人关掉 smartUnpack 就会静默失效。
#   而且它会误伤——实测 jszip 因为一个无扩展名的 .jekyll-metadata 被判为二进制，
#   整包 jszip（约 60 个文件）被无谓解包。显式列出既精确又不依赖猜测。
asarUnpack:
  # node-pty：集成终端面板（src/main/ipc/terminal.ts require('node-pty')）。
  #   需整包解包：不止 pty.node，还有 conpty.dll / winpty.dll / OpenConsole.exe /
  #   winpty-agent.exe —— 这些是 .node 在运行时按同级相对路径加载的伴生二进制，
  #   只解 .node 会导致加载 .node 成功但创建 PTY 失败。
  #   降级行为：require 失败时 catch 住，终端 IPC 返回结构化错误，其余功能不受影响。
  - '**/node_modules/node-pty/**'
# isolated-vm 已从依赖中移除（原先 asarUnpack 里的 isolated-vm 一并删除）。
#   它曾被用来「沙箱化」Mustache 渲染，但沙箱里跑的是**我们自己写的约 100 行
#   渲染器**，template/fields 只作为 ExternalCopy 数据注入、从不当代码执行。
#   于是它唯一的作用是「同一套渲染逻辑写两遍」，任何安全修复都要做两遍，
#   漏一处就是漏洞 —— 实测两条路径确实同构地带着全部 4 个缺陷。
#   而且它在 Electron 44 上**从来没生效过一次**，有两条独立的硬证据：
#     1) ABI：预编译只有 abi137/abi147，Electron 44 是 abi149，require 必抛
#        "No native build was found for platform=win32 arch=x64 runtime=electron abi=149"；
#        源码也编不过（V8 头文件不兼容，C2660 ×2 => MSBuild exit 1）。
#     2) 与 ABI 无关：那段沙箱脚本字符串本身是 TypeScript（`x as Record<...>`、
#        `let condVal: unknown;`），即便原生模块能加载，compileScript 也必然抛
#        SyntaxError（实测 "Unexpected identifier 'as'"）然后静默回退。
#   威胁本身不需要 V8 级隔离：真正的风险是「恶意输入打爆主进程」，靠输入校验
#   就够。现为纯 TS 实现 + 完整预算/深度/迭代/原型链防护
#   （见 src/main/ipc/sandboxed-mustache.ts）。
#
# ABI 重建取舍
#   npmRebuild: false —— 显式关闭（electron-builder 默认 true）。
#     当前唯一的原生模块 node-pty 是 N-API 模块（binding.gyp 依赖 node-addon-api，
#     预编译文件名不带 abi 标签），N-API 跨 Node/Electron ABI 稳定，其
#     prebuilds/win32-x64/pty.node 可直接用，rebuild 对它是纯负担 ——
#     在无 MSVC 工具链的机器与 CI 上开着会让打包直接失败。
#   buildDependenciesFromSource: 保持不配置（默认 false）。同上。
npmRebuild: false
compression: maximum
win:
  target:
    - target: zip
      arch:
        - x64
  icon: build-resources/icon.ico
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: dir
      arch:
        - x64
  icon: build-resources/icon.png
  category: Development
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: dir
      arch:
        - x64
        - arm64
  icon: build-resources/icon.icns
  category: public.app-category.developer-tools
extraResources:
  - from: ../../packages/generator-mod/src
    to: generators/mod
    filter:
      - '**/*.js'
      - '**/*.d.ts'
      - '**/*.json'
  - from: ../../packages/shared/src
    to: shared
    filter:
      - '**/*.js'
      - '**/*.d.ts'
      - '**/*.json'
extraFiles:
  - from: ./scripts/generate-icon.mjs
    to: scripts/generate-icon.mjs
publish: null
