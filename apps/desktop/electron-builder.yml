appId: com.mc-creator.app
productName: MC Creator
# 本地构建不自动发布：避免 electron-builder 因未配置真实仓库地址而报 "Cannot detect repository"
publish: null
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MC Creator
linux:
  target:
    - AppImage
  category: Game
  artifactName: ${productName}-${version}.${ext}
mac:
  target:
    - dmg
  artifactName: ${productName}-${version}.${ext}
