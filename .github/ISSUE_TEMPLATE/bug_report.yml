name: Bug 报告
description: 报告 MC Creator 的 bug
title: '[BUG] '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        感谢报告 bug！请尽量填写完整信息，帮助我们快速定位问题。

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 简要描述遇到了什么问题。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 最小化复现步骤。
      placeholder: |
        1. 启动应用 '...'
        2. 点击 '....'
        3. 选择 '....'
        4. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 描述你期望发生什么。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 描述实际发生了什么。
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 日志
      description: 如果适用，附上截图或构建日志（脱敏后）。

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 / macOS 14 / Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js 版本
      description: 运行 `node -v` 的输出
      placeholder: 'v20.x.x'
    validations:
      required: true

  - type: input
    id: pnpm-version
    attributes:
      label: pnpm 版本
      description: 运行 `pnpm -v` 的输出
      placeholder: '9.x.x'
    validations:
      required: true

  - type: input
    id: mc-creator-version
    attributes:
      label: MC Creator 版本
      description: git commit hash 或 release tag
      placeholder: 'commit hash / v0.0.0'
    validations:
      required: true

  - type: dropdown
    id: generator-type
    attributes:
      label: 生成器类型
      options:
        - Mod
        - 数据包
        - 整合包
        - 服务器配置
        - 材质包
        - 皮肤
        - 资源包
        - 启动器
        - 不适用
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options:
        - Fabric
        - NeoForge
        - Quilt
        - Legacy Fabric
        - Vanilla
        - 不适用
    validations:
      required: true

  - type: dropdown
    id: mc-version
    attributes:
      label: MC 版本
      options:
        - '1.21.11'
        - '1.21.1'
        - '26.1'
        - 不适用
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 额外上下文
      description: 添加任何其他关于问题的上下文。
