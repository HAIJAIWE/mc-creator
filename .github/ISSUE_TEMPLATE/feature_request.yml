name: 功能请求
description: 建议一个新功能或改进
title: '[FEAT] '
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        感谢提出功能建议！请描述清楚你的需求。

  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 简要描述你想要的功能或改进。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
      description: 这个功能解决了什么问题？请描述当前的痛点。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
      description: 描述你希望的解决方案。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他方案。

  - type: dropdown
    id: generator-type
    attributes:
      label: 影响的生成器类型
      multiple: true
      options:
        - Mod
        - 数据包
        - 整合包
        - 服务器配置
        - 材质包
        - 皮肤
        - 资源包
        - 启动器
        - 全部
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - UI（渲染进程）
        - 主进程
        - 核心引擎
        - 共享 schema
        - CI/CD
        - 其他
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 额外上下文
      description: 添加任何其他关于功能请求的上下文。
