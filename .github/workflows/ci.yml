name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --max-warnings 0
      - run: pnpm format:check
      - run: node scripts/check-docs.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  e2e:
    name: E2E (Electron, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 只跑 Linux + Windows，不跑 macOS。理由：
        # ① macOS 不在既有 build 矩阵里，仓库本来就没在 macOS 上验过重活；
        # ② Electron E2E 依赖 GUI 会话，macOS runner 的窗口服务器行为最容易
        #    出现只在 CI 才复现的偶发失败，而这套用例的价值在于「稳定地报红」，
        #    一个时好时坏的信号比没有信号更糟；
        # ③ Linux/Windows 已经覆盖了路径分隔符、大小写敏感、userData 位置
        #    （%APPDATA% vs ~/.config）这几类最容易出平台 bug 的差异。
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Linux 上 Electron 需要一块「屏幕」：GitHub 的 ubuntu runner 没有 X
      # display，Chromium 起不来。xvfb-run 提供虚拟屏，比 --headless 更接近
      # 真实桌面（Electron 的 BrowserWindow 不支持真正的 headless 模式）。
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      # 注意这里**不设** ELECTRON_SKIP_BINARY_DOWNLOAD：E2E 要真跑 Electron，
      # 跳过二进制下载等于没装应用。typecheck job 才需要跳过。
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright OS dependencies
        run: npx playwright install-deps
      - name: Build desktop app (E2E runs against the compiled out/ bundle)
        run: pnpm --filter @mc-creator/desktop build
      - name: Run Playwright E2E
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm --filter @mc-creator/desktop test:e2e
        if: runner.os == 'Linux'
      - name: Run Playwright E2E
        run: pnpm --filter @mc-creator/desktop test:e2e
        if: runner.os != 'Linux'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/desktop/playwright-report/
          retention-days: 7

  bundle:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: [typecheck, test, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mc-creator/desktop build
      - name: Check bundle size
        run: node scripts/check-bundle.mjs

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [typecheck, test, e2e]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies for Electron
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libcups2-dev \
            libxkbcommon-dev \
            libxss-dev \
            libxtst-dev \
            libnss3-dev \
            libdrm-dev \
            libgbm-dev \
            libasound2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
