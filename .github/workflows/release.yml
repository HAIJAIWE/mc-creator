name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.2.0-alpha.1)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm --filter @mc-creator/desktop build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm --filter @mc-creator/desktop package
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @mc-creator/desktop package
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}-release
          path: apps/desktop/release/
          retention-days: 30

      - name: Create Release (only on tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}

  # 版本号格式校验（仅 tag 推送时）
  version-check:
    name: Version Check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # 验证 semver 格式（允许 v 前缀 + alpha/beta/rc）
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'; then
            echo "::error::版本标签 '$TAG' 不符合 semver 格式（应为 vX.Y.Z 或 vX.Y.Z-alpha.N 等）"
            exit 1
          fi
          echo "版本标签校验通过: $TAG"

      - name: Verify package.json version matches
        run: |
          PKG_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          TAG_VERSION=${{ steps.version.outputs.tag }}#v
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::warning::package.json 版本 ($PKG_VERSION) 与标签 ($TAG_VERSION) 不一致，请同步"
          fi
